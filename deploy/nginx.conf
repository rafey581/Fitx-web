# Nginx reverse proxy for the FITX site.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/fitx
#   sudo ln -s /etc/nginx/sites-available/fitx /etc/nginx/sites-enabled/fitx
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run Certbot (it rewrites this block to add TLS + the HTTP->HTTPS
# redirect automatically):
#   sudo certbot --nginx -d fitxfitnessstudio.com -d www.fitxfitnessstudio.com
#
# www.fitxfitnessstudio.com redirects to fitxfitnessstudio.com so search engines
# see one address (it matches APP_URL in .env).

# Long-lived caching for Next.js build assets (name-hashed, safe to cache hard).
map $uri $fitx_cache {
    default                 "no-store";
    ~^/_next/static/        "public, max-age=31536000, immutable";
    ~^/uploads/             "public, max-age=2592000";
    ~^/images/              "public, max-age=2592000";
}

upstream fitx_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name fitxfitnessstudio.com www.fitxfitnessstudio.com;

    # Media uploads go through a server action; keep this >= the app's
    # serverActions.bodySizeLimit (30 MB in next.config.ts) and UPLOAD_MAX_MB.
    client_max_body_size 30m;

    # gzip for text responses (Next already compresses some; this covers the rest).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        # One canonical address: www -> bare domain. Inside this location (not the
        # server block) so Certbot's /.well-known/acme-challenge/ checks still pass.
        if ($host = www.fitxfitnessstudio.com) {
            return 301 https://fitxfitnessstudio.com$request_uri;
        }
        proxy_pass http://fitx_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://fitx_app;
        proxy_set_header Host $host;
        add_header Cache-Control $fitx_cache always;
    }

    location /images/ {
        proxy_pass http://fitx_app;
        proxy_set_header Host $host;
        add_header Cache-Control $fitx_cache always;
    }

    location /uploads/ {
        proxy_pass http://fitx_app;
        proxy_set_header Host $host;
        add_header Cache-Control $fitx_cache always;
    }

    # Optional: keep the admin area private to the studio's IPs.
    # location /admin/ {
    #     allow 203.0.113.0/24;   # studio / office range
    #     deny all;
    #     proxy_pass http://fitx_app;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
